name: Cleanup expired expeditions
on:
  schedule:
    - cron: '4-59/5 * * * *'   # every 5 minutes, offset by 4 min to avoid peak-load round marks
  workflow_dispatch: {}       # allow manual trigger from the Actions tab
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Call cleanup endpoint
        run: |
          curl -sf -X POST https://baseblobs.vercel.app/api/cleanup-expired-expeditions \
            -H "x-cleanup-secret: ${{ secrets.CLEANUP_SECRET }}"
